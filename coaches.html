            data-image="mulan.webp"
            data-desc="Conosciuta da tutti come “Mulan“: ama questo sport e tutto ciò che rappresenta, giocatrice dal 2012, nasce insieme a Simone Franchi come organizzatrice di tornei ed eventi amatoriali al Beach Town già dal 2015. Nel 2013 dà luce all’Asd I Follow Beach Volley, della quale è Presidente e che dal 2020 ha ottenuto ottimi risultati nel campionato italiano per società: oltre 200 tesserati e per 4 anni consecutivi il titolo di vice-campioni italiani. Maestro allenatore di beach volley qualificato FIPAV dal 2022. Responsabile ed icona della scuola di beach volley del Beach Town dal 2021, nella quale ricopre il ruolo di responsabile e coordinatrice.">

            data-desc="🏐 Benvenuta Sofia!

Una nuova importante aggiunta allo staff di I Follow Beach Volley: diamo il benvenuto a Sofia Arcaini, nuova allenatrice IFB! 💙💜

Giocatrice di beach volley da 10 anni e allenatrice da 3, Sofia porta sulla nostra sabbia un bagaglio di esperienza maturato ai massimi livelli nazionali e internazionali.

Nel suo palmarès anche successi nello Snow Volley internazionale, con la vittoria di una tappa del CEV European Tour, oltre al titolo italiano 2026 e al premio di MVP.

Da questa stagione metterà tutta la sua esperienza da atleta e da coach a disposizione dei nostri giocatori.

Benvenuta in IFB, Sofia! 🔥
Ci vediamo sulla sabbia. 🏐">

   <!-- Bottom Sheet / Modale -->

                <h2 id="sheet-name" class="text-3xl md:text-4xl font-black text-slate-900 dark:text-white tracking-tight mb-1"></h2>
                <span id="sheet-role" class="text-primary font-bold text-sm md:text-base uppercase tracking-wider mb-4 block"></span>

<script>
    // --- 1. Riferimenti agli elementi DOM ---
    const backdrop = document.getElementById('modal-backdrop');
    const sheet = document.getElementById('coach-sheet');
    const sheetImage = document.getElementById('sheet-image');
    const sheetName = document.getElementById('sheet-name');
    const sheetRole = document.getElementById('sheet-role');
    const sheetDesc = document.getElementById('sheet-desc');
    const dragHandle = document.getElementById('drag-handle');

    // --- 2. Funzioni di Apertura e Chiusura ---
    function openCoachModal(btnElement) {
        // Estrazione dati
        const name = btnElement.getAttribute('data-name');
        const role = btnElement.getAttribute('data-role');
        const image = btnElement.getAttribute('data-image');
        const desc = btnElement.getAttribute('data-desc');

        // Popolamento testi e immagine
        sheetImage.src = image;
        sheetName.textContent = name;
        sheetRole.textContent = role;
        sheetDesc.textContent = desc;

        // Pulisce eventuali residui del drag-to-dismiss precedente
        sheet.style.transform = '';

        // Mostra backdrop
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
        backdrop.classList.add('opacity-100', 'pointer-events-auto');

        // Mostra sheet
        sheet.classList.remove('opacity-0', 'pointer-events-none');
        sheet.classList.add('opacity-100', 'pointer-events-auto');
        
        // Animazione in base al dispositivo
        if (window.innerWidth < 768) {
            sheet.classList.remove('translate-y-full');
            sheet.classList.add('translate-y-0');
        } else {
            sheet.classList.remove('md:scale-95');
            sheet.classList.add('md:scale-100');
        }

        document.body.style.overflow = 'hidden';
    }

    function closeCoachModal() {
        // Pulisce eventuali residui del drag-to-dismiss
        sheet.style.transform = '';

        // Nascondi backdrop
        backdrop.classList.remove('opacity-100', 'pointer-events-auto');
        backdrop.classList.add('opacity-0', 'pointer-events-none');

        // Nascondi sheet
        sheet.classList.remove('opacity-100', 'pointer-events-auto');
        sheet.classList.add('opacity-0', 'pointer-events-none');
        
        // Animazione di uscita
        if (window.innerWidth < 768) {
            sheet.classList.remove('translate-y-0');
            sheet.classList.add('translate-y-full');
        } else {
            sheet.classList.remove('md:scale-100');
            sheet.classList.add('md:scale-95');
        }

        document.body.style.overflow = '';
    }

    // --- 3. Logica Drag-to-Dismiss (Swipe su Mobile) ---
    let startY = 0;
    let currentY = 0;
    let isDragging = false;

    if (dragHandle) {
        // L'utente tocca la maniglia
        dragHandle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
            sheet.style.transition = 'none'; // Rimuove il ritardo CSS durante il trascinamento
        }, { passive: true });

        // L'utente trascina il dito
        dragHandle.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            const deltaY = currentY - startY;

            // Muove il modale solo verso il basso
            if (deltaY > 0) {
                sheet.style.transform = `translateY(${deltaY}px)`;
            }
        }, { passive: true });

        // L'utente solleva il dito
        dragHandle.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            
            sheet.style.transition = ''; // Ripristina le animazioni Tailwind
            
            const deltaY = currentY - startY;
            
            // Se ha trascinato giù per più di 80 pixel, chiude il modale. Altrimenti rimbalza su.
            if (deltaY > 80) {
                closeCoachModal();
            } else {
                sheet.style.transform = '';
            }
        });
    }

    // --- 4. Chiusura con tasto ESC su PC ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && backdrop.classList.contains('opacity-100')) {
            closeCoachModal();
        }
    });
</script>
