# Aggiorna federali-lombardia.js (tornei FIPAV in Lombardia) con tornei_lombardia.py.
# Gira una volta a settimana, il mercoledì sera; per aggiornare subito:
# Actions → "Tornei Lombardia" → Run workflow.
name: Tornei Lombardia

on:
  schedule:
    # GitHub usa l'ora UTC: 17:00 UTC = 18:00 in Italia d'inverno, 19:00 con l'ora legale
    - cron: '0 17 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tornei-lombardia
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tornei_lombardia.py
      - name: Salva se ci sono novità
        run: |
          # La sola data di aggiornamento non basta per un commit
          if git diff --quiet -I "LOMBARDIA_AGGIORNATO" -- federali-lombardia.js; then
            echo "Nessun torneo cambiato"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add federali-lombardia.js
          git commit -m "tornei Lombardia: aggiornamento dati FIPAV"
          git push
