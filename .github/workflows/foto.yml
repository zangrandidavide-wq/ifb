# Sincronizza le foto dei tornei dal Drive del fotografo a Cloudflare R2 (scripts/sync-foto.mjs).
# Gira ogni ora; per pubblicare subito: Actions → "Foto tornei" → Run workflow.
name: Foto tornei

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      forza:
        description: 'Consenti eliminazioni massicce (album rinominato o tolto)'
        type: boolean
        default: false

concurrency:
  group: foto
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/sync-foto.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FORZA: ${{ inputs.forza }}
