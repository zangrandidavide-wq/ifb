<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="theme-color" content="#7f13ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191022" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <title>Glossario Esercizi | I Follow Beach Volley</title>
    <meta name="description" content="Glossario esercizi IFB: consulta focus tecnici, svolgimento, varianti, tempi e correzioni in una dashboard aggiornata da Google Sheets." />
    <meta name="robots" content="noindex, nofollow, noarchive" />

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&amp;display=block" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="scroll-reveal.css" />
    <style>
        body { font-family: 'Lexend', sans-serif; }
        a:focus-visible, button:focus-visible, article:focus-visible { outline: 3px solid #FFD700; outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) { .motion-safe-only { animation: none !important; } }
    </style>
    <link rel="stylesheet" href="tailwind-glossario.css" />
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-100 antialiased selection:bg-primary selection:text-white min-h-screen flex flex-col overflow-x-hidden">
    <header>
        <div id="navbar-placeholder"></div>
        <script type="module" src="navbar.js"></script>
    </header>

    <main class="flex-1">

        <!-- HERO -->
        <section class="relative overflow-hidden bg-sand dark:bg-sand-dark pt-10 md:pt-14 lg:pt-40 pb-24 md:pb-28 border-b border-gray-200/60 dark:border-gray-700/60">
            <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-secondary via-primary to-secondary opacity-80" aria-hidden="true"></div>
            <div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-primary/10 blur-3xl pointer-events-none" aria-hidden="true"></div>
            <span class="material-icons absolute -right-6 bottom-0 text-[14rem] md:text-[20rem] leading-none text-primary/5 select-none pointer-events-none" aria-hidden="true">menu_book</span>

            <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-12 gap-8 items-end">
                <div class="md:col-span-8">
                    <span class="inline-flex items-center gap-2 text-[11px] sm:text-xs font-bold text-primary uppercase tracking-[0.25em] bg-primary/10 px-4 py-2 rounded-full sr-load-down">
                        <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span> Live da Google Sheets
                    </span>
                    <h1 class="mt-6 font-black uppercase tracking-tight leading-[0.95] text-[clamp(2.5rem,8vw,5.5rem)] text-gray-900 dark:text-white sr-load-up sr-delay-1">
                        Glossario<br /><span class="text-primary">esercizi.</span>
                    </h1>
                </div>
                <div class="md:col-span-4 sr-load-fade sr-delay-2">
                    <span class="block w-14 h-1 rounded-full bg-secondary mb-4" aria-hidden="true"></span>
                    <p class="text-gray-600 dark:text-gray-300 leading-relaxed">
                        Una raccolta dinamica di esercizi tecnici e tattici aggiornata automaticamente da Google Sheets.
                    </p>
                </div>
            </div>
        </section>

        <section class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pb-20">

            <!-- Barra filtri (flottante sopra l'hero) -->
            <div id="filters-wrapper" class="hidden -mt-12 relative z-10 mb-10 bg-white dark:bg-gray-800 rounded-3xl border border-primary/10 shadow-xl shadow-primary/10 p-5 md:p-6 space-y-5">
                <div class="relative">
                    <label for="search-input" class="sr-only">Cerca per nome o focus</label>
                    <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-primary pointer-events-none" aria-hidden="true">search</span>
                    <input
                        id="search-input"
                        type="search"
                        placeholder="Cerca per nome o focus: battuta float, ricezione, muro..."
                        class="w-full pl-12 pr-4 py-4 rounded-full border-2 border-primary/15 bg-background-light dark:bg-background-dark focus:border-primary focus:ring-4 focus:ring-primary/15 text-sm md:text-base font-medium transition-all duration-200 ease-out"
                    />
                </div>
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div id="filters-container" class="flex flex-wrap gap-2" role="group" aria-label="Filtra per tipologia"></div>
                    <p id="results-count" class="inline-flex items-center gap-1.5 bg-gray-900 text-white text-xs font-bold uppercase tracking-wider px-3 py-1.5 rounded-full" aria-live="polite"></p>
                </div>
            </div>

            <div id="exercise-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 pt-12">
                <div id="loading-state" class="col-span-full flex items-center justify-center py-16">
                    <div class="inline-flex items-center gap-3 bg-white dark:bg-gray-800 border border-primary/10 rounded-full px-6 py-3 shadow-lg text-gray-600 dark:text-gray-300">
                        <span class="w-5 h-5 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></span>
                        <span class="font-semibold">Caricamento esercizi...</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <ifbv-footer></ifbv-footer>
    <script src="footer.js" defer></script>

    <div id="exercise-modal" class="fixed inset-0 z-[1000] bg-gray-900/70 backdrop-blur-sm hidden items-center justify-center p-4" role="dialog" aria-modal="true">
        <div id="exercise-modal-panel" class="relative w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-3xl bg-white dark:bg-gray-800 shadow-2xl animate-modal-in motion-safe-only">
            <button
                id="exercise-modal-close"
                type="button"
                aria-label="Chiudi dettagli esercizio"
                class="absolute top-4 right-4 z-10 inline-flex items-center justify-center h-10 w-10 rounded-full bg-white/15 text-white hover:bg-secondary hover:text-gray-900 hover:rotate-90 transition-all duration-300"
            >
                <span class="material-icons text-xl" aria-hidden="true">close</span>
            </button>
            <div id="exercise-modal-content"></div>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyAtVOJkOSzFovjEAlnG_FdBdtfTXhNicec";
        const SPREADSHEET_ID = "1E1IiD8ae3vUDmg7TdOgPzYkjCSK1D9HZSWK1fMh4syI";
        const SHEET_RANGES = ["Foglio1!A:G", "Sheet1!A:G", "Glossario!A:G"];

        const gridEl = document.getElementById("exercise-grid");
        const filtersWrapperEl = document.getElementById("filters-wrapper");
        const filtersContainerEl = document.getElementById("filters-container");
        const searchInputEl = document.getElementById("search-input");
        const resultsCountEl = document.getElementById("results-count");
        const modalEl = document.getElementById("exercise-modal");
        const modalPanelEl = document.getElementById("exercise-modal-panel");
        const modalContentEl = document.getElementById("exercise-modal-content");
        const modalCloseEl = document.getElementById("exercise-modal-close");
        let allRows = [];
        let activeTipologia = "Tutti";
        let searchTerm = "";

        function extractRow(item) {
            return Array.isArray(item) ? item : item?.row || [];
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function nlToBr(value) {
            return escapeHtml(value).replace(/\n/g, "<br>");
        }

        function badgeClassByCategory(category) {
            const normalized = (category || "").toLowerCase();
            if (normalized.includes("tecnica")) return "bg-primary/10 text-primary border-primary/20";
            if (normalized.includes("tattica")) return "bg-blue-100 text-blue-700 border-blue-200";
            if (normalized.includes("fisic")) return "bg-emerald-100 text-emerald-700 border-emerald-200";
            return "bg-amber-100 text-amber-700 border-amber-200";
        }

        // Colore d'accento (bordo sinistro) coerente con il badge di categoria
        function accentClassByCategory(category) {
            const normalized = (category || "").toLowerCase();
            if (normalized.includes("tecnica")) return "border-l-primary";
            if (normalized.includes("tattica")) return "border-l-blue-500";
            if (normalized.includes("fisic")) return "border-l-emerald-500";
            return "border-l-secondary";
        }

        function renderCorrezioni(correzioniRaw) {
            if (!correzioniRaw) return "";

            const lines = correzioniRaw
                .split("\n")
                .map((line) => line.trim())
                .filter(Boolean);

            const isBulletList = lines.every((line) => /^[-*•]/.test(line));
            const cleanedLines = lines.map((line) => line.replace(/^[-*•]\s*/, ""));

            const heading = `
                <p class="flex items-center gap-2 text-xs font-bold uppercase tracking-[0.2em] text-gray-900 dark:text-secondary mb-3">
                    <span class="material-icons text-base" aria-hidden="true">tips_and_updates</span> Correzioni
                </p>`;

            if (isBulletList) {
                const items = cleanedLines
                    .map((line) => `<li class="flex gap-2 leading-relaxed"><span class="material-icons text-primary text-base mt-0.5" aria-hidden="true">check_circle</span><span>${escapeHtml(line)}</span></li>`)
                    .join("");
                return `
                    <div class="mt-6 bg-secondary/15 border-l-4 border-secondary rounded-r-2xl p-5">
                        ${heading}
                        <ul class="text-sm text-gray-700 dark:text-gray-200 space-y-2">${items}</ul>
                    </div>
                `;
            }

            return `
                <div class="mt-6 bg-secondary/15 border-l-4 border-secondary rounded-r-2xl p-5">
                    ${heading}
                    <p class="text-sm text-gray-700 dark:text-gray-200 leading-relaxed">${nlToBr(correzioniRaw)}</p>
                </div>
            `;
        }

        function createCard(row, index, position) {
            const nome = row[0] || "Esercizio senza titolo";
            const tipologia = row[1] || "Generale";
            const focus = row[2] || "";
            const tempo = row[5] || "";
            const number = String(index + 1).padStart(2, "0");
            const delay = Math.min(position, 12) * 40;

            return `
                <article data-index="${index}" tabindex="0" role="button" aria-label="Apri dettagli: ${escapeHtml(nome)}"
                    style="animation-delay:${delay}ms"
                    class="group relative overflow-hidden bg-white dark:bg-gray-800 rounded-3xl border border-gray-100 dark:border-gray-700 border-l-4 ${accentClassByCategory(tipologia)} p-6 shadow-md cursor-pointer hover:shadow-xl hover:shadow-primary/10 hover:-translate-y-0.5 hover:border-primary/40 transition-all duration-200 ease-out flex flex-col gap-3 animate-card-in motion-safe-only">
                    <span class="absolute top-4 right-5 text-5xl font-black text-primary/10 leading-none tabular-nums select-none" aria-hidden="true">${number}</span>
                    <div class="flex flex-wrap items-center gap-2 pr-14">
                        <span class="inline-flex items-center rounded-full border px-3 py-1 text-[11px] font-bold uppercase tracking-wider ${badgeClassByCategory(tipologia)}">
                            ${escapeHtml(tipologia)}
                        </span>
                        ${tempo ? `
                            <span class="inline-flex items-center gap-1 text-xs font-bold text-gray-600 dark:text-gray-300 bg-background-light dark:bg-gray-900/50 rounded-full px-2.5 py-1">
                                <span class="material-icons text-primary text-sm" aria-hidden="true">schedule</span>${escapeHtml(tempo)}
                            </span>
                        ` : ""}
                    </div>
                    <h2 class="text-xl font-extrabold tracking-tight text-gray-900 dark:text-white group-hover:text-primary transition-colors">${escapeHtml(nome)}</h2>
                    ${focus ? `<p class="text-sm text-gray-600 dark:text-gray-400 leading-relaxed line-clamp-3">${escapeHtml(focus)}</p>` : ""}
                    <p class="mt-auto pt-3 inline-flex items-center gap-1 text-xs font-bold uppercase tracking-wider text-primary">
                        Vedi dettagli <span class="material-icons text-base group-hover:translate-x-1 transition-transform" aria-hidden="true">arrow_forward</span>
                    </p>
                </article>
            `;
        }

        function renderGrid(rows) {
            if (!rows.length) {
                gridEl.innerHTML = `
                    <div class="col-span-full bg-white dark:bg-gray-800 border-2 border-dashed border-primary/20 rounded-3xl p-10 text-center">
                        <span class="material-icons text-4xl text-primary/40 mb-2" aria-hidden="true">search_off</span>
                        <p class="font-bold text-gray-800 dark:text-gray-100">Nessun esercizio disponibile per questo filtro.</p>
                    </div>
                `;
                return;
            }

            gridEl.innerHTML = rows
                .map((item, position) => createCard(extractRow(item), item.originalIndex, position))
                .join("");
        }

        function filterRowsByTipologia(tipologia) {
            if (tipologia === "Tutti") return allRows;
            return allRows.filter((item) => (extractRow(item)[1] || "").trim() === tipologia);
        }

        function filterRowsBySearch(rows, term) {
            const normalized = term.trim().toLowerCase();
            if (!normalized) return rows;

            return rows.filter((item) => {
                const row = extractRow(item);
                const nome = (row[0] || "").toLowerCase();
                const focus = (row[2] || "").toLowerCase();
                return nome.includes(normalized) || focus.includes(normalized);
            });
        }

        function getFilteredRows() {
            const byTipologia = filterRowsByTipologia(activeTipologia);
            return filterRowsBySearch(byTipologia, searchTerm);
        }

        function updateResultsCount(count) {
            const label = count === 1 ? "esercizio" : "esercizi";
            resultsCountEl.textContent = `${count} ${label}`;
        }

        function renderFilterButtons() {
            const uniqueTipologie = Array.from(
                new Set(
                    allRows
                        .map((item) => (extractRow(item)[1] || "").trim())
                        .filter(Boolean)
                )
            ).sort((a, b) => a.localeCompare(b, "it", { sensitivity: "base" }));

            const tipologie = ["Tutti", ...uniqueTipologie];

            filtersContainerEl.innerHTML = tipologie.map((tipologia) => {
                const isActive = tipologia === activeTipologia;
                const activeClasses = "bg-primary text-white border-primary shadow-lg shadow-primary/30";
                const inactiveClasses = "bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 border-primary/20 hover:border-primary hover:text-primary hover:-translate-y-0.5";

                return `
                    <button
                        type="button"
                        data-tipologia="${escapeHtml(tipologia)}"
                        aria-pressed="${isActive}"
                        class="px-4 py-2 rounded-full border-2 text-sm font-bold transition-all duration-200 ease-out ${isActive ? activeClasses : inactiveClasses}"
                    >
                        ${escapeHtml(tipologia)}
                    </button>
                `;
            }).join("");

            filtersWrapperEl.classList.remove("hidden");
            gridEl.classList.remove("pt-12");
        }

        filtersContainerEl.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-tipologia]");
            if (!button) return;

            activeTipologia = button.dataset.tipologia || "Tutti";
            renderFilterButtons();
            const filteredRows = getFilteredRows();
            renderGrid(filteredRows);
            updateResultsCount(filteredRows.length);
        });

        searchInputEl.addEventListener("input", (event) => {
            searchTerm = event.target.value || "";
            const filteredRows = getFilteredRows();
            renderGrid(filteredRows);
            updateResultsCount(filteredRows.length);
        });

        function openModal(index) {
            const exercise = allRows[index];
            if (!exercise) return;
            const row = extractRow(exercise);
            const nome = row[0] || "Esercizio senza titolo";
            const tipologia = row[1] || "Generale";
            const focus = row[2] || "";
            const svolgimento = row[3] || "";
            const varianti = row[4] || "";
            const tempo = row[5] || "";
            const correzioni = row[6] || "";

            modalContentEl.innerHTML = `
                <div class="relative overflow-hidden bg-gradient-to-br from-primary to-primary-dark text-white px-6 md:px-8 pt-8 pb-7">
                    <div class="absolute -bottom-16 -right-10 w-48 h-48 rounded-full bg-secondary/25 blur-3xl" aria-hidden="true"></div>
                    <div class="relative flex flex-wrap items-center gap-2 mb-4 pr-12">
                        <span class="inline-flex items-center rounded-full bg-secondary text-gray-900 px-3 py-1 text-[11px] font-bold uppercase tracking-wider">
                            ${escapeHtml(tipologia)}
                        </span>
                        ${tempo ? `
                            <span class="inline-flex items-center gap-1 rounded-full bg-white/15 px-3 py-1 text-xs font-bold">
                                <span class="material-icons text-sm" aria-hidden="true">schedule</span>${escapeHtml(tempo)}
                            </span>
                        ` : ""}
                    </div>
                    <h2 class="relative text-2xl md:text-3xl font-black tracking-tight pr-10">${escapeHtml(nome)}</h2>
                    ${focus ? `<p class="relative mt-2 text-white/85 font-medium">${escapeHtml(focus)}</p>` : ""}
                </div>
                <div class="px-6 md:px-8 py-7 space-y-6">
                    ${svolgimento ? `
                        <div>
                            <p class="flex items-center gap-2 text-xs font-bold uppercase tracking-[0.2em] text-primary mb-2">
                                <span class="material-icons text-base" aria-hidden="true">play_circle</span> Svolgimento
                            </p>
                            <p class="text-sm md:text-base text-gray-600 dark:text-gray-300 leading-relaxed">${nlToBr(svolgimento)}</p>
                        </div>
                    ` : ""}
                    ${varianti ? `
                        <div class="border-t-2 border-dashed border-primary/15 pt-6">
                            <p class="flex items-center gap-2 text-xs font-bold uppercase tracking-[0.2em] text-primary mb-2">
                                <span class="material-icons text-base" aria-hidden="true">alt_route</span> Varianti
                            </p>
                            <p class="text-sm md:text-base text-gray-600 dark:text-gray-300 leading-relaxed">${nlToBr(varianti)}</p>
                        </div>
                    ` : ""}
                    ${renderCorrezioni(correzioni)}
                </div>
            `;

            modalEl.classList.remove("hidden");
            modalEl.classList.add("flex");
            document.body.style.overflow = "hidden";
            modalCloseEl.focus();
        }

        function closeModal() {
            modalEl.classList.add("hidden");
            modalEl.classList.remove("flex");
            modalContentEl.innerHTML = "";
            document.body.style.overflow = "";
        }

        gridEl.addEventListener("click", (event) => {
            const card = event.target.closest("article[data-index]");
            if (!card) return;
            const index = Number(card.dataset.index);
            if (!Number.isInteger(index)) return;
            openModal(index);
        });

        gridEl.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            const card = event.target.closest("article[data-index]");
            if (!card) return;
            event.preventDefault();
            openModal(Number(card.dataset.index));
        });

        modalCloseEl.addEventListener("click", closeModal);
        modalEl.addEventListener("click", (event) => {
            if (!modalPanelEl.contains(event.target)) closeModal();
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !modalEl.classList.contains("hidden")) {
                closeModal();
            }
        });

        async function fetchSheetData() {
            for (const range of SHEET_RANGES) {
                const endpoint = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;
                const response = await fetch(endpoint);

                if (response.ok) {
                    return response.json();
                }

                if (response.status !== 400 && response.status !== 404) {
                    throw new Error(`Errore API: ${response.status}`);
                }
            }

            throw new Error("Nessun foglio valido trovato tra i range configurati.");
        }

        async function loadGlossario() {
            try {
                const data = await fetchSheetData();
                const rows = Array.isArray(data.values) ? data.values.slice(1) : [];

                if (!rows.length) {
                    renderGrid(rows);
                    return;
                }

                allRows = rows.map((row, originalIndex) => ({ row, originalIndex }));
                renderFilterButtons();
                const filteredRows = getFilteredRows();
                renderGrid(filteredRows);
                updateResultsCount(filteredRows.length);
            } catch (error) {
                console.error("Errore caricamento glossario:", error);
                gridEl.innerHTML = `
                    <div class="col-span-full bg-red-50 dark:bg-red-950/20 border-l-4 border-red-500 rounded-3xl p-6 text-center">
                        <p class="font-semibold text-red-700 dark:text-red-300">Impossibile caricare gli esercizi. Controlla API key, Spreadsheet ID e range.</p>
                    </div>
                `;
            }
        }

        loadGlossario();
    </script>
    <script src="scroll-reveal.js" defer></script>
</body>
</html>
